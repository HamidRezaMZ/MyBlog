{% extends "registration/base.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title-meta %}حذف مقاله{% endblock %}</title>
</head>
<body>
{% block title %}
    حذف مقاله
{% endblock %}

{% block Main %}
    <div class="col-md-8 text-center mx-auto">
        <div class="card card-danger">
            <div class="card-header">
                <h3 class="card-title mb-0 float-left">حذف مقاله</h3>
            </div>

            <div class="card-body py-4">
                <form method="post">{% csrf_token %}
                    <p class="py-2">آیا از حدف مقاله "{{ object }}" از "{{ object.author.get_full_name }}" اطمینان دارد؟</p>
                    <input type="submit" value="حذف"  class="btn btn-danger">
                </form>
            </div>
        </div>
    </div>
{% endblock %}
</body>
</html>
