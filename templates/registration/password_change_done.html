{% extends "registration/base.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title-meta %}تغییر گذرواژه{% endblock %}</title>
</head>
<body>
{% block title %}
    تغییر گذرواژه با موفقیت انجام شد
{% endblock %}

{% block Main %}
    <div class="col-md-8 text-center mx-auto">
        <div class="card card-success">
            <div class="card-header">
                <h3 class="card-title mb-0 float-left">تغییر گذرواژه</h3>
            </div>

            <div class="card-body py-4">
                <form method="post">{% csrf_token %}
                    <p class="py-2">تغییر گذرواژه با موفقیت انجام شد</p>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
</body>
</html>
