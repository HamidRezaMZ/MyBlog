{% load static %}
{% load BaseTags %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Programming WebBlog | {% block Title %}{% endblock %}</title>

    <!-- Bootstrap core CSS -->
    <link href="{% static "main_static_file/vendor/bootstrap/css/bootstrap.min.css" %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
          integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI1w=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <!-- Custom fonts for this template -->
    <link href="{% static "main_static_file/vendor/fontawesome-free/css/all.min.css" %}" rel="stylesheet"
          type="text/css">

    <!-- Custom styles for this template -->
    <link href="{% static "main_static_file/css/clean-blog.min.css" %}" rel="stylesheet">
    <link href="{% static "main_static_file/css/rtl.css" %}" rel="stylesheet">
    <link href='https://cdn.fontcdn.ir/Font/Persian/Sahel/Sahel.css' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="{% static 'star-ratings/css/star-ratings.css' %}">


</head>

<body style="font-family: Sahel;  font-weight: normal;">

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
    <div class="container">
        <a class="navbar-brand" href="{% url "Blog:Home" %}" style="font-weight: normal;">{% title %}</a>
        <button style="font-family: Sahel;
font-weight: normal;" class="navbar-toggler navbar-toggler-right" type="button" data-toggle="collapse"
                data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false"
                aria-label="Toggle navigation">
            منو
            <i class="fas fa-bars"></i>
        </button>
        {% category_navbar %}
    </div>
</nav>


{% block Main %}
{% endblock %}

<hr>

<!-- Footer -->
<footer>
    <div class="container">
        <div class="row">
            <div class="col-lg-8 col-md-10 mx-auto">
                <ul class="list-inline text-center">
                    <li class="list-inline-item">
                        <a href="#">
                            <span class="fa-stack fa-lg">
                              <i class="fas fa-circle fa-stack-2x"></i>
                              <i class="fab fa-twitter fa-stack-1x fa-inverse"></i>
                            </span>
                        </a>
                    </li>
                    <li class="list-inline-item">
                        <a href="#">
                            <span class="fa-stack fa-lg">
                              <i class="fas fa-circle fa-stack-2x"></i>
                              <i class="fab fa-facebook-f fa-stack-1x fa-inverse"></i>
                            </span>
                        </a>
                    </li>
                    <li class="list-inline-item">
                        <a href="https://github.com/Hamidrezamhz" target="_blank">
                            <span class="fa-stack fa-lg">
                              <i class="fas fa-circle fa-stack-2x"></i>
                              <i class="fab fa-github fa-stack-1x fa-inverse"></i>
                            </span>
                        </a>
                    </li>
                </ul>
                <p class="copyright text-muted">Copyright &copy; Your Website 2020</p>
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap core JavaScript -->
<script src="{% static "main_static_file/vendor/jquery/jquery.min.js" %}"></script>
<script src="{% static "main_static_file/vendor/bootstrap/js/bootstrap.bundle.min.js" %}"></script>

<!-- Custom scripts for this template -->
<script src="{% static "main_static_file/js/clean-blog.min.js" %}"></script>
<script type="text/javascript" src="{% static 'star-ratings/js/dist/star-ratings.min.js' %}"></script>

</body>

</html>
