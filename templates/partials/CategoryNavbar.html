{% load static %}
<link rel="stylesheet" href="{% static "main_static_file/css/rtl.css" %}">
<div class="collapse navbar-collapse nav" id="navbarResponsive">
    <ul class="navbar-nav ml-auto">
{#        <li class="nav-item">#}
{#            <a class="nav-link" href="{% url 'Blog:Home' %}">خانه</a>#}
{#        </li>#}
{#    #}
        {% for cat in category %}
            {% if cat.parent == None %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'Blog:Category' cat.slug %}">{{ cat.title }}</a>
                    {% if cat.children.active %}
                        {% include 'Blog/partials/category_loop.html' %}
                    {% endif %}
                </li>
            {% endif %}
        {% endfor %}
    </ul>
    <form class="form-inline mt-3 mr-5" action="{% url "Blog:Search" %}">
        <input type="text" name="q" class="form-control" style="font-family: Sahel" placeholder="جستجو...">
        <button class="btn btn-success"
                style="padding: 8px;border-radius: 5px;margin-right: 5px;font-family: Sahel;font-weight: normal">جستجو
        </button>
    </form>
</div>
